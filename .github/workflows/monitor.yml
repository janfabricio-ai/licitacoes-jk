name: Monitoramento Diário de Licitações

on:
  schedule:
    - cron: "7 10 * * *"   # 10h07 UTC = 7h07 Brasília (minuto deslocado p/ fugir da fila do GH Actions)
  workflow_dispatch:        # permite rodar manualmente
  push:
    branches: [main]        # dispara a cada push no main

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Instalar 2captcha
        run: pip install 2captcha-python

      - name: Executar monitoramento
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLL_PASS: ${{ secrets.BLL_PASS }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: python monitor_licitacoes.py
